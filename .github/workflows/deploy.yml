name: CI/CD Pipeline for Laravel 12 to Azure

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. PRUEBAS Y ANÁLISIS ESTÁTICO
  # ==========================================
  static-analysis:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: laravel_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping" 
          --health-interval=10s 
          --health-timeout=5s 
          --health-retries=3

    steps:
      # Step 1: Check code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: PHP and Composer configuration
      - name: Set up PHP and install Composer dependencies
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_mysql
          coverage: none
          tools: composer

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Set up the database environment
        run: |
          cp .env.example .env
          php artisan key:generate
        # [NUEVO] Inyectamos las variables para conectar al MySQL efímero
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: laravel_test
          DB_USERNAME: root
          DB_PASSWORD: ""

      - name: Run migrations and tests
        run: |
          php artisan migrate --force
          php artisan test
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: laravel_test
          DB_USERNAME: root
          DB_PASSWORD: ""

      - name: Run Laravel Pint
        run: vendor/bin/pint --test

  # ==========================================
  # 2. CONSTRUCCIÓN DEL ARTEFACTO (Producción)
  # ==========================================
  build:
    runs-on: ubuntu-latest
    needs: static-analysis
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Run composer install for production
        run: composer install --prefer-dist --no-progress --no-dev --optimize-autoloader

      - name: Clear Config Caches
        run: |
          php artisan config:clear
          php artisan route:clear
          php artisan view:clear

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: php-app
          path: .

  # ==========================================
  # 3. DESPLIEGUE EN AZURE
  # ==========================================
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
      
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: php-app

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'rodadalibre' # RECUERDA REEMPLAZAR ESTO
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .